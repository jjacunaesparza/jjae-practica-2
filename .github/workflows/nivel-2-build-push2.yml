name: Docker Build + Subir a GHCR + Prueba en contenedor

on:
  push:
    branches:
      - push-imagen

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # necesario para pushear imagen

    steps:
      - uses: actions/checkout@v4

      - name: Login a GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build imagen
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Push imagen
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Debug vars
        run: |
          echo "actor: ${{ github.actor }}"
          echo "repo: ${{ github.repository }}"

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Login a GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull imagen
        run: docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Ejecutar tests dentro del contenedor
        run: |
          docker run --rm ghcr.io/${{ github.repository }}:${{ github.sha }} npm test