name: Docker Build + Subir a GHCR

on:
  push:
    branches:
      - push-imagen

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # necesario para pushear imagen

    steps:
      - uses: actions/checkout@v4

      - name: Login a GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build imagen
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Push imagen
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npm test