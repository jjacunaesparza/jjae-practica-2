name: Build de imagen + Test

on:
  push:
    branches:
     - build-imagen


jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de imagen Docker
        env:
          REPOSITORY: cloud-webapp
          IMAGE_TAG: ${{ github.sha }}
        run: docker build -t $REPOSITORY:$IMAGE_TAG .

  test:
    runs-on: ubuntu-latest
    needs: docker-build  # Esto asegura que el test se ejecute después del docker-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      -  run: npm install
      -  run: npm test